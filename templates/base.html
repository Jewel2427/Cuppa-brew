<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ shop.name }}: {{ shop.slogan }}. {{ shop.tagline }}">
  <title>{% block title %}{{ shop.name }} | Butuan City{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='images/logo-original.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Rubik:wght@700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='images/logo-white.png') }}" alt="{{ shop.name }}">
      </a>
      <nav>
        <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' }}">Home</a>
        <a href="{{ url_for('menu') }}" class="{{ 'active' if request.endpoint == 'menu' }}">Menu</a>
        <a href="{{ url_for('contact') }}" class="{{ 'active' if request.endpoint == 'contact' }}">Visit</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <a href="{{ shop.facebook }}" target="_blank" rel="noopener">
        <span class="ico">f</span> Cuppa Brew Cafe
      </a>
      <a href="{{ shop.map_url }}" target="_blank" rel="noopener">
        <span class="ico">📍</span> Rosewood Plains Subd., Brgy. Villa Kananga, Butuan City
      </a>
      <a href="{{ shop.instagram }}" target="_blank" rel="noopener">
        <span class="ico">◎</span> {{ shop.instagram_handle }}
      </a>
    </div>
    <p class="footer-small">© {{ shop.name }} · {{ shop.slogan }}</p>
  </footer>
</body>
</html>
